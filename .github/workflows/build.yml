name: Build

on:
  push:
    branches: [main, codex/performance-0.33.2.2]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Optional numeric version (e.g. 0.33.2.4). Empty = automatic build version and release."
        required: false
        type: string

permissions:
  contents: read

# Serialize complete publishing workflows so an older build cannot replace Latest.
# Superseded pending workflows have not started building yet. PRs run separately.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'releases' }}
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - name: Check release automation
        run: python3 -m unittest discover -s tests -p 'test_release.py'

      - name: Version
        id: v
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: python3 tools/release.py version

      - uses: actions/cache@v4
        with:
          path: godot_dl
          key: godot-${{ env.GODOT_VERSION }}

      - name: Godot editor + Windows template
        run: python3 tools/fetch_godot.py godot_dl

      - name: Build DroneFlames.exe
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          python3 tools/build.py --godot godot_dl/godot --template godot_dl/windows_release_x86_64.exe \
            --version "$VERSION" --repo "$GITHUB_REPOSITORY" --out dist
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: DroneFlames-${{ steps.v.outputs.version }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name != 'pull_request' && needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: DroneFlames-${{ needs.build.outputs.version }}
          path: dist

      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python3 tools/release.py publish --version "$VERSION" --repo "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" --dist dist
